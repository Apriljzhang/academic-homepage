<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My FA materials PDF · ITTC</title>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
<script src="./config.js?v=7"></script>
<script src="./store.js?v=7"></script>
<style>
  body {
    padding-bottom: 24px;
    font-family: Calibri, Carlito, "Segoe UI", sans-serif;
  }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--color-paper, #F5E6C8);
    border-bottom: 1.5px dashed var(--color-line, #8B7355);
  }
  .toolbar .brand { font-weight: 700; }
  .toolbar .status { color: var(--color-muted, #6B5E48); font-size: 13px; }
  .toolbar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .toolbar button {
    font-family: inherit;
    font-weight: 700;
    border: 1.5px dashed var(--color-line, #8B7355);
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
    background: #6B5344;
    color: #FFF8E8;
  }
  .toolbar button.secondary {
    background: #FFF8E8;
    color: #2C2416;
  }

  /* Show every workshop screen in the pack (unlike live deck). */
  #pack .screen {
    display: block !important;
    position: relative !important;
    opacity: 1 !important;
    visibility: visible !important;
    pointer-events: none;
    max-width: 920px;
    margin: 0 auto 18px;
    padding: 18px;
    background: #FFF8E8;
    border: 1.5px dashed #8B7355;
    border-radius: 4px;
    color: #2C2416 !important;
    page-break-inside: avoid;
    break-inside: avoid;
  }
  #pack .screen * { color: inherit; }
  #pack .zh { display: none !important; }
  #pack .tr-btn,
  #pack .navdock,
  #pack [id^="downloadPdf"],
  #pack .download-banner { display: none !important; }

  .pack-cover {
    max-width: 920px;
    margin: 16px auto;
    padding: 22px;
    background: #FFF8E8;
    border: 1.5px dashed #8B7355;
    border-radius: 4px;
    color: #2C2416;
  }
  .pack-cover h1 { margin: 0 0 8px; font-size: 1.6rem; }
  .mine-banner {
    margin: 12px 0;
    padding: 10px 12px;
    background: #F0DDB0;
    border: 1.5px dashed #8B7355;
    border-radius: 4px;
    color: #2C2416;
  }
  .mine-banner strong { display: block; margin-bottom: 4px; }
  #pack .choice.selected,
  #pack .choice.correct,
  #pack .choice.wrong {
    outline: 2px solid #6B5344;
    font-weight: 700;
  }
  #pack img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 10px 0;
    border: 1.5px dashed #8B7355;
  }
  #pack textarea,
  #pack [contenteditable] {
    display: block;
    width: 100%;
    min-height: 64px;
    padding: 10px;
    border: 1.5px dashed #8B7355;
    background: #FFF8E8;
    white-space: pre-wrap;
  }

  @media print {
    .toolbar { display: none !important; }
    body { background: white !important; }
    #pack .screen, .pack-cover {
      break-after: page;
      box-shadow: none;
    }
  }
</style>
</head>
<body>
<div class="toolbar no-print">
  <div>
    <div class="brand" title="International Training and Testing Centre">ITTC · City University of Macau</div>
    <div class="status" id="status">Loading workshop pages…</div>
  </div>
  <div class="actions">
    <button type="button" class="secondary" id="backBtn">Back to workshop</button>
    <button type="button" class="secondary" id="printBtn">Print / Save as PDF</button>
    <button type="button" id="pdfBtn">Download PDF file</button>
  </div>
</div>

<div id="pack"></div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const studentId = params.get("sid") || localStorage.getItem("ittc_student_id") || localStorage.getItem("lttc_student_id") || "";
  const localName = localStorage.getItem("ittc_name") || localStorage.getItem("lttc_name") || "";
  const localSession = localStorage.getItem("ittc_session") || localStorage.getItem("lttc_session") || "202607";
  const localVotes = JSON.parse(localStorage.getItem("ittc_votes") || localStorage.getItem("lttc_votes") || "{}");
  const localAnswered = JSON.parse(localStorage.getItem("ittc_answered") || localStorage.getItem("lttc_answered") || "{}");
  const localTransfer = localStorage.getItem("ittc_transfer") || localStorage.getItem("lttc_transfer") || "";
  const localIcan = localStorage.getItem("ittc_ican") || localStorage.getItem("lttc_ican") || "";
  const localShares = {};
  ["s1", "s2", "s3", "s4", "s5"].forEach((s) => {
    const t = localStorage.getItem(`ittc_share_${s}`) || localStorage.getItem(`lttc_share_${s}`);
    if (t) localShares[s] = t;
  });

  const statusEl = document.getElementById("status");
  const pack = document.getElementById("pack");
  document.getElementById("backBtn").onclick = () => {
    location.href = "./";
  };
  document.getElementById("printBtn").onclick = () => window.print();

  function esc(s) {
    return String(s ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  function absUrl(rel) {
    try {
      return new URL(rel, location.href).href;
    } catch {
      return rel;
    }
  }

  function mineBox(title, body) {
    const el = document.createElement("div");
    el.className = "mine-banner";
    el.innerHTML = `<strong>${esc(title)}</strong>${esc(body || "(not saved)")}`;
    return el;
  }

  function waitAssets(root) {
    const fontsReady = document.fonts?.ready || Promise.resolve();
    const imgs = [...root.querySelectorAll("img")].map(
      (img) =>
        new Promise((resolve) => {
          if (img.complete && img.naturalWidth) return resolve();
          img.onload = () => resolve();
          img.onerror = () => resolve();
          // cache-bust relative workshop assets
          if (img.getAttribute("src") && !img.src.startsWith("data:")) {
            img.src = absUrl(img.getAttribute("src"));
          }
        })
    );
    return Promise.all([fontsReady, ...imgs]);
  }

  async function loadStudent() {
    if (!studentId) {
      return {
        name: localName || "Student",
        session: localSession,
        stats: {},
      };
    }
    try {
      if (window.TrainingStore?.me) {
        const data = await window.TrainingStore.me(studentId);
        return {
          name: data.student?.name || localName || "Student",
          session: data.student?.session_code || localSession,
          stats: data.stats || {},
        };
      }
      const res = await fetch(`/api/me/${studentId}/portfolio`);
      if (!res.ok) throw new Error("missing");
      const data = await res.json();
      return {
        name: data.student?.name || localName || "Student",
        session: data.student?.session_code || localSession,
        stats: data.stats || {},
      };
    } catch {
      return { name: localName || "Student", session: localSession, stats: {} };
    }
  }

  function annotate(root, student) {
    const st = student.stats || {};
    const votes = { ...localVotes, ...(st.scenario_map || {}) };
    const shares = { ...localShares, ...(st.share_by_strategy || {}) };
    const answered = { ...localAnswered };
    (st.quiz_answers || []).forEach((q) => {
      if (q?.quiz_id) answered[q.quiz_id] = q.answer;
    });
    const transfer =
      localTransfer ||
      (st.choice_items || []).filter((c) => c.kind === "transfer_note").map((c) => c.text).pop() ||
      "";
    const ican =
      localIcan ||
      (st.choice_items || []).filter((c) => c.kind === "ican_draft").map((c) => c.text).pop() ||
      "";

    // Mark chosen quiz options
    root.querySelectorAll(".choice[data-quiz]").forEach((btn) => {
      const qid = btn.dataset.quiz;
      const ans = answered[qid];
      if (ans && btn.dataset.answer === String(ans)) {
        btn.classList.add("selected");
        if (btn.dataset.correct === "true") btn.classList.add("correct");
        else btn.classList.add("wrong");
      }
      if (btn.dataset.correct === "true") btn.classList.add("correct");
    });

    // Scenario votes
    Object.entries(votes).forEach(([id, vote]) => {
      const btn = root.querySelector(`.choice.vote[data-scenario="${id}"][data-vote="${String(vote).toUpperCase()}"]`);
      if (btn) btn.classList.add("selected");
      const sc = root.querySelector(`.scenario[data-scenario="${id}"]`);
      if (sc && !sc.querySelector(".mine-banner")) {
        sc.appendChild(mineBox("Your vote", String(vote).toUpperCase()));
      }
    });

    // Text inputs
    const icanEl = root.querySelector("#icanDraft");
    if (icanEl) {
      icanEl.replaceWith(mineBox("Your “I can…” criterion", ican || "(not saved)"));
    }
    root.querySelectorAll(".share-input[data-strategy]").forEach((el) => {
      const s = el.dataset.strategy;
      el.replaceWith(mineBox(`Your GenAI idea · ${String(s).toUpperCase()}`, shares[s] || "(no idea shared)"));
    });
    const transferBox = root.querySelector("#transferBox");
    if (transferBox) {
      transferBox.textContent = transfer || "(no reflection yet)";
    }
    const transferOut = root.querySelector("#transferOut");
    if (transferOut) transferOut.textContent = transfer || "No reflection yet.";

    // Dashboard numbers
    const map = {
      st_tr: st.translate_clicks || 0,
      st_q: st.quiz_attempted || 0,
      st_c: st.quiz_correct || 0,
      st_p: st.pages_viewed || 0,
      st_share: st.share_ideas || Object.keys(shares).length,
      st_vote: st.scenario_votes || Object.keys(votes).length,
    };
    Object.entries(map).forEach(([id, val]) => {
      const el = root.querySelector("#" + id);
      if (el) el.textContent = String(val);
    });

    // Match activity selects if present
    if (st.match_latest) {
      const a2 = root.querySelector('[data-page="a2"]');
      if (a2) {
        a2.appendChild(
          mineBox(
            "Your Activity 2 match",
            `Score ${st.match_latest.score}/${st.match_latest.total}${st.match_latest.correct ? " · all correct" : ""}`
          )
        );
      }
    }

    // Absolute image URLs for canvas/PDF
    root.querySelectorAll("img").forEach((img) => {
      const src = img.getAttribute("src");
      if (src) img.setAttribute("src", absUrl(src));
    });

    // Remove live controls that clutter the pack
    root.querySelectorAll("button.btn, button.share-btn, button.tr-btn").forEach((b) => {
      if (b.classList.contains("choice")) return;
      b.remove();
    });
  }

  async function build() {
    const student = await loadStudent();
    statusEl.textContent = `Building pack for ${student.name}…`;

    let html;
    try {
      const res = await fetch("./index.html?v=7", { cache: "no-store" });
      if (!res.ok) throw new Error("index missing");
      html = await res.text();
    } catch (err) {
      statusEl.textContent = "Could not load workshop HTML. Open this page from the training site.";
      console.error(err);
      return;
    }

    const doc = new DOMParser().parseFromString(html, "text/html");
    const screens = [...doc.querySelectorAll("main.shell > section.screen")].filter(
      (s) => s.dataset.page && s.dataset.page !== "join"
    );
    if (!screens.length) {
      statusEl.textContent = "Workshop screens not found.";
      return;
    }

    const cover = document.createElement("section");
    cover.className = "pack-cover";
    cover.innerHTML = `
      <div class="meta" style="color:#6B5E48;font-size:12px;margin-bottom:8px">International Training and Testing Centre (ITTC) · City University of Macau</div>
      <h1>Formative Assessment Frameworks & GenAI</h1>
      <p>Personal materials pack — same pages as the workshop HTML, with your inputs filled in.</p>
      <p><strong>Student:</strong> ${esc(student.name)}<br>
      <strong>Session:</strong> ${esc(student.session)}<br>
      <strong>Generated:</strong> ${esc(new Date().toLocaleString("en-GB"))}</p>
      <p style="color:#6B5E48;font-size:12px">全球視野與創新發展 · 新時代全球化與教育新視野</p>
    `;

    const frag = document.createDocumentFragment();
    frag.appendChild(cover);
    screens.forEach((screen) => {
      const clone = document.importNode(screen, true);
      clone.classList.add("active");
      frag.appendChild(clone);
    });
    pack.replaceChildren(frag);
    annotate(pack, student);
    await waitAssets(pack);

    statusEl.textContent = `${student.name} · ${student.session} · ${screens.length} workshop pages ready`;
    wireDownload(student);
  }

  function wireDownload(student) {
    const safeName = String(student.name || "student").replace(/[^\w\-]+/g, "_").slice(0, 40) || "student";
    document.getElementById("pdfBtn").onclick = async () => {
      statusEl.textContent = "Generating PDF file…";
      await waitAssets(pack);
      // Temporarily simplify page-break rules that make html2pdf emit blank pages.
      const opt = {
        margin: [8, 8, 8, 8],
        filename: `ITTC_FA_${safeName}_pack.pdf`,
        image: { type: "jpeg", quality: 0.95 },
        html2canvas: {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: "#F5E6C8",
          logging: false,
          onclone: (clonedDoc) => {
            const clonedPack = clonedDoc.getElementById("pack");
            if (!clonedPack) return;
            clonedPack.querySelectorAll(".screen, .pack-cover, .mine-banner, p, h1, h2, h3, li, span, div, label, strong").forEach((el) => {
              el.style.color = "#2C2416";
              el.style.visibility = "visible";
              el.style.opacity = "1";
              el.style.display = el.style.display === "none" ? "none" : el.style.display;
            });
            clonedPack.querySelectorAll(".zh").forEach((el) => {
              el.style.display = "none";
            });
          },
        },
        jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
        pagebreak: { mode: ["avoid-all"] },
      };
      try {
        await html2pdf().set(opt).from(pack).save();
        statusEl.textContent = `${student.name} · PDF downloaded`;
      } catch (err) {
        console.error(err);
        statusEl.textContent = "File download failed — use Print / Save as PDF (matches the HTML).";
        window.print();
      }
    };
  }

  build();
})();
</script>
</body>
</html>
